name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:ci

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:cov

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:contract -- --runInBand

  integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start S3 (LocalStack)
        # Used to be MinIO. MinIO OSS (server/client/KES) is now archived
        # upstream and gone from every free channel: docker.io required auth
        # first, then quay.io/minio/minio started requiring it too, and the
        # dl.min.io binary download now returns 410 Gone ("archived and no
        # longer maintained"). LocalStack's S3 emulation is this job's
        # replacement — test-only, not a MinIO replacement for production
        # storage (see docs/runbook.md).
        #
        # Pinned to 2.3.2, from before LocalStack started requiring
        # LOCALSTACK_AUTH_TOKEN on newer tags (including `latest`) — the same
        # "moving tag" trap the old MinIO pin was already avoiding.
        # GATEWAY_LISTEN keeps it on port 9000 so storage.service.ts's own
        # tests need no endpoint/credential changes: LocalStack's community
        # S3 accepts any access key/secret without validating them.
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e SERVICES=s3 \
            -e GATEWAY_LISTEN=0.0.0.0:9000 \
            localstack/localstack:2.3.2
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/_localstack/health && break
            sleep 1
          done
      - run: npm ci
      - run: npm run test:integration

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, lint, unit, contract, integration]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
