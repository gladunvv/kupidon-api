app:
  port: 8000
  cors:
    allowedOrigins:
      - http://localhost:5173
      - http://localhost:5174

mongodb:
  uri: mongodb://127.0.0.1:27017/datingapp

redis:
  url: redis://127.0.0.1:6379

jwt:
  secret: change-this-access-secret
  secret_refresh: change-this-refresh-secret
  accessExpiresIn: 1h
  refreshExpiresIn: 7d

otp:
  ttlSeconds: 300
  length: 4
  cooldownSeconds: 60
  requestWindowSeconds: 3600
  maxRequestsPerWindow: 5
  maxRequestsPerIpWindow: 30
  maxVerifyAttempts: 5
  blockSeconds: 900

encryption:
  # Supports key rotation: keep every version a currently-stored message was
  # ever encrypted under so old messages stay decryptable, and point
  # currentVersion at the one new messages should use. To rotate, add a new
  # entry and bump currentVersion — do not remove old entries while any
  # message still references them.
  currentVersion: 1
  keys:
    # 32-byte key encoded as 64 hexadecimal characters. Replace in production.
    - version: 1
      key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# S3-compatible object storage for user photos. Point this at a local MinIO
# (see docker-compose.yml) for development, or any real S3-compatible
# bucket in production. publicUrl is the browser-reachable base URL that
# gets embedded in stored photo URLs.
storage:
  endpoint: http://127.0.0.1:9000
  region: us-east-1
  bucket: kupidon-photos
  accessKeyId: kupidon
  secretAccessKey: change-this-storage-secret
  publicUrl: http://127.0.0.1:9000/kupidon-photos

# Optional. Omit this section entirely to run without error tracking (the
# default). Uncomment and set a real DSN to send unhandled 5xx errors to
# Sentry.
# sentry:
#   dsn: https://examplePublicKey@o0.ingest.sentry.io/0

# Optional. Omit to leave GET /metrics unauthenticated (fine for local dev
# and a compose stack Prometheus reaches over a private network). Set a
# token for any deployment where /metrics is reachable from outside a
# trusted network — Prometheus sends it back via a bearer_token scrape
# config option.
# metrics:
#   token: change-this-metrics-scrape-token
